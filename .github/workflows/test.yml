name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check korb/ tests/

      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check korb/ tests/

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run basedpyright korb

      - name: Complexity budget
        if: matrix.python-version == '3.12'
        run: |
          if uvx radon cc korb -s --show-closures | grep -E '\-\s(C|D|E|F)\s'; then
            echo "::error::Complexity C or worse found"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest -v --tb=short
